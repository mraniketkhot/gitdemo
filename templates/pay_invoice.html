{% extends 'base.html' %}{% block body %}<h5>Pay Rent: {{invoice.month_label}}</h5><p>Total: ₹{{invoice.total_amount}}</p>{% if upi_deeplink %}<a href='{{upi_deeplink}}' class='btn btn-success'>Open UPI App</a>{% endif %}{% if pg.qr_code_url %}<p class='mt-3'>Desktop payment QR:</p><img src='{{pg.qr_code_url}}' style='max-width:240px'>{% endif %}<p class='mt-2'>Bank A/C: {{pg.bank_account}} | IFSC: {{pg.ifsc}}</p><a class='btn btn-primary' href='/customer/mark-paid/{{invoice.id}}'>I Have Paid</a>{% endblock %}
