{% extends 'base.html' %}{% block body %}
<h4>Manager Dashboard</h4>
<div class='mb-2'><a href='/manager/pg/create' class='btn btn-sm btn-primary'>Create PG</a> <a href='/manager/customer/create' class='btn btn-sm btn-success'>Admit Customer</a> <a href='/manager/reports' class='btn btn-sm btn-info'>Reports</a> <a href='/manager/mfa' class='btn btn-sm btn-warning'>Run MFA</a></div>
<h5>Your PGs</h5><ul class='list-group'>{% for pg in pgs %}<li class='list-group-item'>{{pg.name}} - {{pg.city}} <a class='btn btn-sm btn-outline-primary' href='/manager/pg/{{pg.id}}/payment-settings'>Payment Settings</a></li>{% endfor %}</ul>
<h5 class='mt-3'>Add Flat</h5><form method='post' action='/manager/flat/create' class='row g-1'><div class='col'><input name='name' class='form-control' placeholder='Flat Name'></div><div class='col'><input name='floor_number' class='form-control' placeholder='Floor'></div><div class='col'><input name='pg_id' class='form-control' placeholder='PG ID'></div><div class='col'><button class='btn btn-secondary'>Add</button></div></form>
<h5 class='mt-3'>Add Room</h5><form method='post' action='/manager/room/create' class='row g-1'><div class='col'><input name='name' class='form-control' placeholder='Room Name'></div><div class='col'><select name='sharing_type' class='form-select'><option>single</option><option>two_share</option><option>three_share</option></select></div><div class='col'><input name='capacity' class='form-control' placeholder='Capacity'></div><div class='col'><input name='rent_per_bed' class='form-control' placeholder='Rent/Bed'></div><div class='col'><input name='flat_id' class='form-control' placeholder='Flat ID'></div><div class='col'><button class='btn btn-secondary'>Add</button></div></form>
<h5 class='mt-3'>Create Monthly Rent</h5><form method='post' action='/manager/rent/create' class='row g-1'><div class='col'><input name='customer_id' class='form-control' placeholder='Customer Profile ID'></div><div class='col'><input name='month_label' class='form-control' placeholder='2026-04'></div><div class='col'><button class='btn btn-dark'>Create Invoice</button></div></form>
{% endblock %}
